# CI 工作流定义（可选启用）
#
# 由于 GitHub 要求推送 .github/workflows/ 下的文件必须持有 'workflow' 权限，
# 本文件以模板形式随仓库分发。启用方式（二选一）：
#   本地：mkdir -p .github/workflows && cp docs/ci.yml .github/workflows/ci.yml && git add -A && git commit -m 'ci: 启用 CI' && git push
#   网页：在 GitHub 仓库页 New file，路径填 .github/workflows/ci.yml，内容复制本文件
# 提示：若 gh 的 token 缺少 workflow 权限，先执行 gh auth refresh -h github.com -s workflow

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.8", "3.10", "3.11", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语料库完整性校验（条号连续、与头部声明一致）
        run: python3 scripts/law.py verify

      - name: 解析器 + 语料库自检
        run: python3 scripts/selftest.py

      - name: 语料库统计
        run: python3 scripts/law.py stats

      - name: 检索工具冒烟测试
        run: |
          set -e
          python3 scripts/law.py list > /dev/null
          python3 scripts/law.py article 劳动合同法 38 > /dev/null
          python3 scripts/law.py article 民法典 第五百七十七条 -A 2 -B 1 > /dev/null
          python3 scripts/law.py search 竞业限制 违约金 -n 3 > /dev/null
          python3 scripts/law.py search 第五百八十八条 > /dev/null
          python3 scripts/law.py search "严重违反" --or 辞退 解除 -n 3 > /dev/null
          python3 scripts/law.py search --regex "提前(三十日|三日)" > /dev/null
          python3 scripts/law.py search 违约金 --json > /dev/null
          echo "全部命令通过"

      - name: 脚本可编译（Python 3.8 兼容性）
        run: python3 -m py_compile scripts/*.py examples/*.py

      - name: MCP 服务器自检（工具调用全链路）
        run: python3 scripts/mcp_server.py --selftest

      - name: MCP stdio 协议冒烟测试
        run: |
          set -e
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_article","arguments":{"doc":"劳动合同法","article":"38"}}}' \
          | python3 scripts/mcp_server.py | python3 -c "
          import sys, json
          lines = [json.loads(l) for l in sys.stdin if l.strip()]
          by_id = {d.get('id'): d for d in lines}
          assert by_id[1]['result']['serverInfo']['name'] == 'china-legal-advisor', 'initialize 失败'
          assert len(by_id[2]['result']['tools']) == 5, 'tools/list 数量不对'
          assert '第三十八条' in by_id[3]['result']['content'][0]['text'], 'tools/call 未返回条文'
          print('MCP stdio 协议通过')
          "

      - name: HTTP API 冒烟测试
        run: |
          set -e
          python3 scripts/serve.py --port 8899 > /tmp/serve.log 2>&1 &
          SERVE_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8899/health > /dev/null && break || sleep 0.5
          done
          curl -sf http://127.0.0.1:8899/health | grep -q '"status": "ok"'
          curl -sf "http://127.0.0.1:8899/search?q=%E7%AB%9E%E4%B8%9A%E9%99%90%E5%88%B6%20%E8%BF%9D%E7%BA%A6%E9%87%91&limit=2" | grep -q '第二十三条'
          curl -sf "http://127.0.0.1:8899/article?doc=%E5%8A%B3%E5%8A%A8%E5%90%88%E5%90%8C%E6%B3%95&no=38" | grep -q '第三十八条'
          curl -sf http://127.0.0.1:8899/tools/openai.json | grep -q 'search_law'
          kill $SERVE_PID
          echo "HTTP API 通过"

      - name: 知识库打包冒烟测试
        run: |
          set -e
          python3 scripts/build_kb.py --profile all --out /tmp/kb --zip
          test -f /tmp/kb/00-使用说明.md
          test -f /tmp/kb/01-民法典.md
          test -f /tmp/kb/mobile/01-系统提示词-可复制.txt
          test -f "/tmp/kb/mobile/中国法律条文-核心版-民法典与劳动.docx"
          test -f "/tmp/kb/mobile/中国法律条文-全量版-33部法规.docx"
          test -f /tmp/kb/china-legal-advisor-kb-mobile.zip
          # DOCX 必须是合法 zip 且含中文条文
          python3 -c "
          import zipfile
          f = '/tmp/kb/mobile/中国法律条文-核心版-民法典与劳动.docx'
          with zipfile.ZipFile(f) as z:
              assert 'word/document.xml' in z.namelist(), 'docx 结构不对'
              assert '第三十八条' in z.read('word/document.xml').decode('utf-8'), 'docx 内容缺失'
          print('DOCX 校验通过')
          "
          echo "知识库打包通过"

      - name: 语料元数据完整性（每部法规须有 title/version/source/fetched）
        run: |
          python3 - <<'PY'
          import sys, importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("law", "scripts/law.py")
          law = importlib.util.module_from_spec(spec); sys.modules["law"] = law
          spec.loader.exec_module(law)
          missing = []
          for d in law.load_corpus():
              for k in ("title", "short", "category", "version", "source", "fetched"):
                  if not d.header.get(k):
                      missing.append(f"{d.slug}: 缺少 {k}")
          if missing:
              print("\n".join(missing)); sys.exit(1)
          print(f"元数据完整：{len(law.load_corpus())} 个文件")
          PY
